<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="A simple way to choose your next campus canteen."
    >
    <title>Where Should I Eat?</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="picker">
      <p class="eyebrow">A LITTLE HELP WITH LUNCH</p>
      <h1>WHERE SHOULD<br> I EAT?</h1>
      <p class="intro">Can't decide? Pick a campus canteen.</p>

      <section id="start-screen" aria-labelledby="spots-heading">
        <h2 id="spots-heading">OUR FOUR SPOTS</h2>
        <p class="spots">
          Tai Tai Foodtopia <span aria-hidden="true">·</span>
          Communal Student Canteen<br>
          Gourmet Shop <span aria-hidden="true">·</span> The Forest
        </p>
        <button class="button button-primary" id="pick-button" type="button">
          Pick a canteen
        </button>
      </section>

      <section id="suggestion-screen" aria-live="polite" hidden>
        <p class="eyebrow">YOUR SUGGESTION</p>
        <h2 class="result-name" id="suggestion-name"></h2>
        <div class="actions">
          <button class="button button-primary" id="accept-button" type="button">
            I'll eat here
          </button>
          <button class="button button-secondary" id="another-button" type="button">
            Pick another
          </button>
        </div>
        <button class="button button-text" id="reset-button" type="button">
          Start again
        </button>
      </section>

      <section id="confirmed-screen" aria-live="polite" hidden>
        <h2 class="result-name">
          You're going to <span id="confirmed-name"></span>.
        </h2>
        <p class="enjoy">Enjoy your meal!</p>
        <button class="button button-primary" id="confirmed-reset-button" type="button">
          Start again
        </button>
      </section>
    </main>
  </body>
</html>
